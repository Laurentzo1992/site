events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # TLS est termine en amont par le reverse-proxy Caddy partage du VPS.
    # Ce serveur ne parle qu'en HTTP en interne, sur le reseau kbbot_backend.
    server {
        listen 80;
        server_name oser-bf.org www.oser-bf.org;

        location /static/ {
            alias /var/www/site/static/;
        }

        location /media/ {
            alias /var/www/site/media/;
        }

        location / {
            proxy_pass http://django:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Caddy a deja pose ce header en fonction du schema cote client (https) ;
            # on le repercute tel quel plutot que de le regenerer avec $scheme,
            # qui vaudrait "http" ici (connexion interne Caddy -> Nginx).
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
