services:
  db:
    image: postgres:15
    container_name: oser_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./oser_backup.sql:/docker-entrypoint-initdb.d/01_restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oser_redis
    restart: unless-stopped

  django:
    build: .
    container_name: mentorat_site
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - static_volume:/var/www/site/static
      - media_volume:/var/www/site/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: oser_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "mentors", "worker", "-l", "info"]
    volumes:
      - static_volume:/var/www/site/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build: .
    container_name: oser_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "mentors", "beat", "-l", "info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - django
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/site/static
      - media_volume:/var/www/site/media
    networks:
      - default
      - kbbot_backend

networks:
  default: {}
  kbbot_backend:
    external: true

volumes:
  pgdata:
  static_volume:
  media_volume:
